#
# Limit the request rate to 50 requests per second per IP address to prevent DDoS attack
#
limit_req_zone $binary_remote_addr zone=mylimit:10m rate=50r/s;

#
# Set a response status code that is returned to rejected requests
#
limit_req_status 429;

server
{
	listen 3001;
	root /usr/share/nginx/html;
	index index.html;

	# Enable rate limiting to prevent Brute force attacks, DoS and DDoS attacks, and Web scraping
	limit_req zone=mylimit burst=100 nodelay;

	# Serve built static assets (JS, CSS, images, etc.)
	# Vite outputs these under /admin/assets/, /admin/chunks/, etc.
	# The physical files are directly under /usr/share/nginx/html/assets/...
	location /admin/assets/ {
		alias /usr/share/nginx/html/assets/;
		expires 1y;
		access_log off;
	}

	location /admin/chunks/ {
		alias /usr/share/nginx/html/chunks/;
		expires 1y;
		access_log off;
	}

	location /admin/entries/ {
		alias /usr/share/nginx/html/entries/;
		expires 1y;
		access_log off;
	}

	# All other /admin/* routes → serve index.html so React Router handles them
	location /admin/ {
		alias /usr/share/nginx/html/;
		try_files $uri /index.html;
	}
}
