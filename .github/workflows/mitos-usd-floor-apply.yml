name: mitos-usd-floor-apply

on:
  push:
    branches:
      - feature/mitos-flexible-reservation-payment
    paths:
      - .github/workflows/mitos-usd-floor-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mitos-flexible-reservation-payment
          fetch-depth: 0

      - name: Apply authoritative USD-floor payment slice
        run: python3 .github/scripts/apply_mitos_usd_floor.py

      - name: Correct generated pricing service boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/services/bookingPricingService.ts')
          text = path.read_text()
          marker = "    currency: mercadoPagoCurrency,\n  }\n}\n}\n"
          if marker not in text:
              raise SystemExit('Expected generated duplicate service boundary not found')
          path.write_text(text.replace(marker, "    currency: mercadoPagoCurrency,\n  }\n}\n", 1))
          PY

      - name: Correct generated frontend type boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checkout = Path('frontend/src/pages/Checkout.tsx')
          text = checkout.read_text()
          old = "throw new Error('MitoS partial reservation payments are authoritative through Mercado Pago only')"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected two generated Error collisions, found {count}')
          checkout.write_text(text.replace(old, "throw new globalThis.Error('MitoS partial reservation payments are authoritative through Mercado Pago only')"))

          status = Path('frontend/src/components/CheckoutStatus.tsx')
          text = status.read_text()
          old = "const partialPayment = booking.status === bookcarsTypes.BookingStatus.Deposit"
          if old not in text:
              raise SystemExit('Expected CheckoutStatus booking guard not found')
          status.write_text(text.replace(old, "const partialPayment = booking?.status === bookcarsTypes.BookingStatus.Deposit", 1))
          PY

      - name: Validate reservation-floor currency copy
        run: |
          if grep -R "S/ 35" backend/src/services frontend/src/lang/checkout.ts frontend/src/pages/Checkout.tsx; then
            echo "Stale S/35 reservation-floor copy found"
            exit 1
          fi

      - name: Build and certify backend
        working-directory: backend
        run: |
          npm install
          npm run build
          node dist/scripts/mitos-flexible-reservation-payment-policy-cert.js

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --force
          npm run build

      - name: Build admin
        working-directory: admin
        run: |
          npm install --force
          npm run build

      - name: Commit corrected slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend admin packages .github/workflows/mitos-flexible-reservation-payment.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "fix(mitos): make reservation floor USD-denominated"
          git push origin HEAD:feature/mitos-flexible-reservation-payment
