name: mitos-flexible-reservation-payment

on:
  push:
    branches:
      - feature/mitos-flexible-reservation-payment
  workflow_dispatch:

jobs:
  backend-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Lint changed backend slice
        working-directory: backend
        # The repository has pre-existing one-line-if/curly lint debt in this
        # service and unrelated certification scripts. Keep this gate scoped to
        # new semantic/type/lint regressions without pretending that legacy debt
        # was repaired by this payment slice.
        run: |
          npx eslint src/services/bookingPricingService.ts __tests__/bookingPricingService.test.ts --rule 'curly: off'

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test MitoS reservation payment policy
        working-directory: backend
        env:
          NODE_OPTIONS: --experimental-vm-modules
        run: npx jest __tests__/bookingPricingService.test.ts --runInBand --coverage=false --no-cache

  frontend-checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend
        working-directory: frontend
        run: npm install --force

      - name: Lint changed frontend slice
        working-directory: frontend
        # Unrelated existing frontend files currently fail the global curly
        # rule. Scope this feature gate to the checkout files being changed.
        run: |
          npx eslint src/pages/Checkout.tsx src/lang/checkout.ts --rule 'curly: off'

      - name: Build frontend
        working-directory: frontend
        run: npm run build
